<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Arquitetura do homelab DockServ</title><desc id="d">Rede local e Tailscale acessam Caddy, Open WebUI e File Browser. Os serviços ficam em Docker; Ollama serve modelos GGUF; dados persistem em /srv/data e backups externos.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b2d"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17c964"/><stop offset="1" stop-color="#00a8a8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".28"/></filter></defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="60" y="58" fill="#e8f1ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">DockServ · arquitetura de referência</text><text x="60" y="88" fill="#9fb3c8" font-family="Arial,sans-serif" font-size="16">Acesso privado por padrão · Docker Compose · dados persistentes</text>
<g font-family="Arial,sans-serif" filter="url(#s)"><rect x="60" y="135" width="240" height="105" rx="16" fill="#18283d" stroke="#4c6885"/><text x="180" y="174" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">Cliente</text><text x="180" y="202" fill="#a9c0d8" text-anchor="middle" font-size="15">LAN / Tailscale</text>
<rect x="390" y="135" width="250" height="105" rx="16" fill="#172b2a" stroke="#17c964" stroke-width="2"/><text x="515" y="174" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">Reverse proxy</text><text x="515" y="202" fill="#8af0b0" text-anchor="middle" font-size="15">Caddy · HTTPS</text>
<rect x="730" y="115" width="400" height="145" rx="18" fill="#13243a" stroke="#3c6288"/><text x="930" y="147" fill="#e8f1ff" text-anchor="middle" font-size="19" font-weight="700">Aplicações web</text><rect x="760" y="169" width="160" height="64" rx="10" fill="#203b54"/><text x="840" y="196" fill="#fff" text-anchor="middle" font-size="15">Site Nginx</text><text x="840" y="217" fill="#a9c0d8" text-anchor="middle" font-size="12">porta interna 80</text><rect x="940" y="169" width="160" height="64" rx="10" fill="#203b54"/><text x="1020" y="196" fill="#fff" text-anchor="middle" font-size="15">App Node/Python</text><text x="1020" y="217" fill="#a9c0d8" text-anchor="middle" font-size="12">rede Docker</text>
<rect x="390" y="330" width="250" height="110" rx="16" fill="#172b2a" stroke="#17c964" stroke-width="2"/><text x="515" y="371" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">Open WebUI</text><text x="515" y="400" fill="#8af0b0" text-anchor="middle" font-size="15">interface de chat</text>
<rect x="730" y="330" width="400" height="110" rx="16" fill="#13243a" stroke="#3c6288"/><text x="930" y="371" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">Ollama API</text><text x="930" y="400" fill="#a9c0d8" text-anchor="middle" font-size="15">GGUF · CPU/GPU · /v1</text>
<rect x="390" y="510" width="740" height="95" rx="16" fill="#28243a" stroke="#8b78bd"/><text x="760" y="548" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">Armazenamento persistente</text><text x="760" y="576" fill="#c8bce8" text-anchor="middle" font-size="15">/srv/data · modelos · uploads · volumes · backups externos</text></g>
<g fill="none" stroke="#6f8aa6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M300 188 H390"/><path d="M640 188 H730"/><path d="M515 240 V330"/><path d="M640 385 H730"/><path d="M930 260 V330"/><path d="M515 440 V510"/><path d="M930 440 V510"/><path d="M372 180 l12 8 -12 8"/><path d="M712 180 l12 8 -12 8"/><path d="M632 377 l8 8 -8 8"/></g><text x="60" y="640" fill="#7f96ad" font-family="Arial,sans-serif" font-size="14">Nota: portas de APIs e painéis ficam privadas; publique apenas o proxy se isso for realmente necessário.</text></svg>