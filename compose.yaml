name: dockserv
services:
  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_data:/root/.ollama
      - ${MODELS_DIR:-./data/models}:/models:ro
    ports: ["127.0.0.1:11434:11434"]
    networks: [ai]
    security_opt: [no-new-privileges:true]
    logging: &log
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.18
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
    volumes: [open_webui_data:/app/backend/data]
    ports: ["127.0.0.1:3000:8080"]
    networks: [ai]
    security_opt: [no-new-privileges:true]
    logging: *log
  site:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes: ["./site:/usr/share/nginx/html:ro"]
    ports: ["127.0.0.1:8081:80"]
    networks: [web]
    security_opt: [no-new-privileges:true]
    logging: *log
  demo-app:
    build: ./apps/node-demo
    restart: unless-stopped
    ports: ["127.0.0.1:3002:3000"]
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *log
  filebrowser:
    image: filebrowser/filebrowser:v2.32.0
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${FILES_DIR:-./data/files}:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config
    ports: ["127.0.0.1:8080:80"]
    networks: [files]
    security_opt: [no-new-privileges:true]
    logging: *log
networks:
  ai: {name: dockserv-ai}
  web: {name: dockserv-web}
  files: {name: dockserv-files}
volumes:
  ollama_data:
  open_webui_data:
  filebrowser_db:
  filebrowser_config:
